id: cohort-approval
name: cohort-approval
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  functions:
    enabled: true
    auth:
      type: application
  storage:
    enabled: false
secrets:
  - name: CHAT_TICKET_KEY
    description: Signs the chat tickets the Discovery tab sends to the GitHub Copilot relay
