<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cohort Discovery · MedicalCohortDemo</title>
<script>try { const t = localStorage.getItem('cohort-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/fonts.css" />
<link rel="stylesheet" href="/theme.css" />
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px, 290px) minmax(320px, 1fr) minmax(360px, 540px); }
  .topbar-inner { gap: 16px; }
  .brand { flex: 0 1 auto; overflow: hidden; }
  @media (max-width: 1500px) { .brand-sub { display: none; } }
  @media (max-width: 1250px) { #account { display: none; } }
  .col { min-height: 0; display: flex; flex-direction: column; }
  .scroll { overflow: auto; min-height: 0; }
  .rail { border-right: 1px solid var(--border); }
  .side { border-left: 1px solid var(--border); }
  .col-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 12px; border-bottom: 1px solid var(--border); flex: none; }
  .col-title { font-family: var(--font-display); font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .col-title::before { content: ""; width: 7px; height: 7px; background: var(--accent); }
  select.field { width: auto; height: 28px; padding: 0 8px; font-size: 12.5px; }
  .actions .field { max-width: 170px; }

  /* Ontology browser */
  .search { padding: 12px 14px 8px; flex: none; }
  .tree { padding: 4px 6px 24px; font-size: 13px; }
  .node { display: grid; grid-template-columns: 16px 1fr auto 24px; align-items: center; gap: 4px; padding: 3px 4px 3px 0; border-radius: 2px; }
  .node:hover { background: var(--surface-2); }
  .node-toggle, .node-add { appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0; font-size: 12px; line-height: 1; height: 20px; }
  .node-toggle { transition: transform .25s var(--ease); }
  .node-toggle.open { transform: rotate(90deg); }
  .node-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
  .node.folder > .node-name { cursor: pointer; }
  .node-count { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .node-add { font-size: 16px; color: var(--accent); opacity: 0; transition: opacity .15s ease; }
  .node:hover .node-add, .node-add:focus-visible { opacity: 1; }
  .children { margin-left: 12px; border-left: 1px solid var(--border); padding-left: 2px; overflow: hidden; }
  .hit-path { display: block; font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item { display: block; width: 100%; text-align: left; appearance: none; border: 0; border-bottom: 1px solid var(--border); background: transparent; padding: 10px 16px; cursor: pointer; color: var(--text); font: inherit; }
  .history-item:hover { background: var(--surface-2); }
  .history-item.current { box-shadow: inset 3px 0 0 var(--accent); background: var(--surface-2); }
  .hi-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .hi-q { font-size: 13px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Chat */
  .messages { flex: 1; padding: 22px clamp(18px, 3vw, 40px) 12px; }
  .msg { max-width: 760px; margin: 0 auto 22px; }
  .msg-who { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .msg.user .msg-body { font-size: 15px; font-weight: 500; }
  .msg.assistant .msg-who::before { content: ""; width: 7px; height: 7px; background: var(--accent); }
  .msg-body { font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .msg-body p { margin: 0 0 10px; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body ul, .msg-body ol { margin: 0 0 10px; padding-left: 20px; }
  .msg-body pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; overflow: auto; font: 12px/1.5 var(--font-mono); }
  .msg-body table { border-collapse: collapse; font-size: 13px; margin: 6px 0 10px; }
  .msg-body th, .msg-body td { border-bottom: 1px solid var(--border); padding: 4px 12px 4px 0; text-align: left; }
  .msg-body h3, .msg-body h4 { font-family: var(--font-display); font-weight: 500; margin: 12px 0 6px; font-size: 15px; }
  .activity { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .activity::before { content: ""; width: 6px; height: 6px; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .tool-line { font-size: 12px; color: var(--faint); margin: 2px 0; }
  .tool-note { font-size: 12px; color: var(--muted); font-style: italic; margin: 2px 0 2px 14px; }
  .tool-line.done::before { content: "✓ "; color: var(--good); }
  .tool-line.fail::before { content: "× "; color: var(--bad); }
  .welcome { max-width: 760px; margin: 6vh auto 0; }
  .starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-top: 18px; }
  .starter { appearance: none; text-align: left; border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; font: 13.5px/1.4 var(--font); color: var(--text); cursor: pointer; transition: border-color .2s ease, background-color .2s ease; }
  .starter:hover { border-color: var(--text); background: var(--surface-2); }
  .starter small { display: block; color: var(--faint); font-size: 11.5px; margin-top: 3px; }
  .composer { flex: none; border-top: 1px solid var(--border); padding: 12px clamp(18px, 3vw, 40px) 16px; }
  .composer-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 180px; }
  .composer .btn { height: 44px; padding: 0 18px; }
  .composer-meta { max-width: 760px; margin: 6px auto 0; font-size: 11.5px; color: var(--faint); display: flex; justify-content: space-between; }

  /* Query side */
  .side-body { padding: 18px 22px 40px; display: grid; gap: 24px; align-content: start; }
  .panel { max-width: none; flex: 1 1 100%; cursor: pointer; transition: border-color .2s ease, background-color .2s ease; }
  .panel.target { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .panel.not.target { border-style: dashed; }
  .panels { flex-direction: column; gap: 0; }
  .joiner { align-self: flex-start; padding: 6px 0 6px 12px; }
  .panel-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .panel-ctl label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .panel-ctl input[type=number] { width: 52px; height: 24px; padding: 0 6px; }
  .panel-ctl input[type=date] { height: 24px; padding: 0 6px; width: 122px; }
  .panel-ctl .field { font-size: 12px; }
  .panel-empty { font-size: 12.5px; color: var(--faint); padding: 6px 2px; }
  .chip { cursor: default; }
  .chip-edit { display: flex; gap: 6px; margin-top: 6px; }
  .chip-edit .field { height: 26px; padding: 0 6px; font-size: 12px; }
  .chip-link { appearance: none; border: 0; background: none; padding: 0; color: var(--muted); font-size: 11.5px; cursor: pointer; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .chip-link:hover { color: var(--text); text-decoration-color: var(--accent); }
  .flash { animation: flash 1.2s var(--ease); }
  @keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
  .count { font-family: var(--font-display); font-weight: 500; font-size: 46px; line-height: 1; letter-spacing: -0.01em; }
  .count small { font-family: var(--font); font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .bars-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 26px; }
  .bars { grid-template-columns: minmax(64px, max-content) 1fr 34px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dax-run { border-top: 1px solid var(--border); padding-top: 14px; }
  .dax-run pre { margin: 8px 0; max-height: 220px; }
  .empty-side { color: var(--muted); font-size: 13.5px; }
  .busy-veil { opacity: .55; transition: opacity .3s ease; }

  /* Narrower screens: the ontology and history slide in from the left as a drawer */
  #railToggle { display: none; }
  @media (max-width: 1180px) {
    #railToggle { display: inline-flex; }
    .layout { grid-template-columns: minmax(300px, 1fr) minmax(340px, 460px); }
    .rail { position: fixed; z-index: 40; left: 0; top: var(--bar-h); bottom: 0; width: 320px; background: var(--bg);
      box-shadow: var(--float); transform: translateX(-102%); transition: transform .45s var(--ease); }
    body.rail-open .rail { transform: none; }
  }
  @media (max-width: 760px) {
    body { overflow: auto; height: auto; }
    .layout { grid-template-columns: 1fr; }
    .side { border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Cohort Discovery</span>
      <span class="brand-sub">Contoso Health · i2b2 on Microsoft Fabric</span>
    </a>
    <div class="actions">
      <button type="button" class="btn" id="railToggle" aria-expanded="false">Ontology and history</button>
      <div class="seg" role="group" aria-label="Mode" id="modeSeg">
        <button type="button" data-mode="i2b2" aria-pressed="true" title="Build and run i2b2 queries (recorded, can be submitted)">i2b2 query</button>
        <button type="button" data-mode="dax" aria-pressed="false" title="Free DAX on the semantic model (counts only, not recorded)">DAX explore</button>
      </div>
      <select class="field" id="model" aria-label="Copilot model"></select>
      <select class="field" id="effort" aria-label="Thinking level" hidden></select>
      <span class="source-id" id="account" title="GitHub Copilot account"></span>
      <div class="seg" role="group" aria-label="Colour theme">
        <button type="button" data-theme-set="light">Light</button>
        <button type="button" data-theme-set="dark">Dark</button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="col rail" aria-label="Ontology and history">
    <div class="col-head">
      <div class="seg" role="tablist" id="railSeg">
        <button type="button" data-rail="ontology" aria-pressed="true">Ontology</button>
        <button type="button" data-rail="history" aria-pressed="false">History</button>
      </div>
    </div>
    <div id="railOntology" class="col" style="flex:1">
      <div class="search"><input class="field" id="search" type="search" placeholder="Search terms, e.g. nodule, E11, metformin" autocomplete="off" /></div>
      <div class="tree scroll" id="tree"></div>
    </div>
    <div id="railHistory" class="scroll" hidden style="flex:1"></div>
  </aside>

  <section class="col" aria-label="Chat with Copilot">
    <div class="messages scroll" id="messages"></div>
    <div class="composer">
      <div class="composer-inner">
        <textarea class="field" id="input" rows="1" placeholder="Ask a cohort question"></textarea>
        <button type="button" class="btn btn-primary" id="send">Ask</button>
      </div>
      <div class="composer-meta"><span id="modeNote">i2b2 mode: every run is recorded with a QUERY_MASTER_ID; counts are obfuscated.</span><button type="button" class="chip-link" id="newChat">New conversation</button></div>
    </div>
  </section>

  <aside class="col side" aria-label="The query">
    <div class="side-body scroll" id="side"></div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.error) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
};

const STARTERS = {
  i2b2: [
    ['Multi-panel questions', [
      ['How many adults aged 50 to 79 who are current or former smokers had a low-dose chest CT showing a lung nodule of 8 mm or more, with no lung cancer diagnosis?', 'Five panels: age bands, smoking status, procedure, measurement and NOT'],
      ['How many patients with type 2 diabetes and chronic kidney disease have had an HbA1c of 6.5% or higher at least twice, but have never been prescribed metformin?', 'Two diagnoses, a repeated lab value and NOT'],
      ['How many patients aged 65 or older with heart failure and hypertension have had an eGFR below 60 at least twice and two or more inpatient stays?', 'Five panels, two of them repeated'],
      ['How many former smokers have a lung nodule of at least 8 mm in either upper lobe?', 'Two location modifiers ORed in one panel'],
      ['How many patients had a low-dose chest CT and an abnormal lung imaging finding at the same visit, excluding anyone with COPD or emphysema?', 'Same visit, with an exclusion at any time'],
      ['How many women with breast cancer have had a mammogram and have a surgical pathology report?', 'Demographics, diagnosis, procedure and document type'],
      ['How many patients with hypertension and a BMI of 30 or more have been prescribed a statin since 2020?', 'A drug class folder with a date and a measurement'],
    ]],
    ['One feature each', [
      ['How many adults aged 50 or older are former smokers with a lung nodule of at least 6 mm?', 'Age bands, a coded answer and a measurement'],
      ['How many patients with type 2 diabetes have never been prescribed metformin?', 'A diagnosis folder AND NOT a medication'],
      ['How many patients have a lung nodule of at least 8 mm in the right upper lobe?', 'A measurement with a location modifier'],
      ['How many patients aged 65 or older with heart failure have had an inpatient stay?', 'Demographics, diagnosis and visit type'],
      ['How many patients have had an eGFR below 60 at least twice?', 'A lab value, repeated'],
      ['How many patients were diagnosed with COPD or emphysema since 2020?', 'OR within a panel, with a date'],
      ['How many patients with lung cancer have a pathology report?', 'A diagnosis folder and a document type'],
      ['How many current daily smokers have COPD?', 'A small count: shown as fewer than 4'],
    ]],
  ],
  dax: [
    ['Examples', [
      ['How many patients are there by sex and age band?', 'Counts by two demographic columns'],
      ['How many patients had a low-dose CT of the chest in each year since 2020?', 'Counts by year from observation dates'],
      ['Among patients with type 2 diabetes, how many have each diabetes medication class?', 'Counts across an ontology folder'],
    ]],
  ],
};
const TOOL_WORDS = {
  search_ontology: 'Searching the ontology', browse_ontology: 'Browsing the ontology', list_modifiers: 'Reading the modifiers',
  preview_query: 'Checking the query', run_i2b2_query: 'Running the i2b2 query', list_queries: 'Reading the query history',
  get_query: 'Opening a query', submit_request: 'Submitting the request', request_status: 'Checking the request',
  describe_model: 'Reading the semantic model', explore_dax: 'Running DAX',
};
const BREAKDOWNS = [['Age patient breakdown', 'Age'], ['Gender patient breakdown', 'Gender'], ['Race patient breakdown', 'Race'], ['Vital Status patient breakdown', 'Vital status']];

const S = {
  mode: 'i2b2', chatId: null, busy: false, info: null, models: [],
  builder: { query_timing: 'ANY', panels: [{ items: [] }] }, target: 0, builderNote: '',
  result: null, request: null, daxRuns: [], numeric: {}, history: [], currentQm: null, editing: null,
};

/* ------------------------------------------------------------------ wording for the query (same rules as the approval app) */
const OPS = { GT: '>', GE: '≥', LT: '<', LE: '≤', EQ: '=', NE: '≠' };
const valueText = (v) => {
  const unit = v.value_unit_of_measure ? ` ${v.value_unit_of_measure}` : '';
  if (v.value_type === 'TEXT') return `${v.value_operator.toLowerCase()} ${v.value_constraint}`;
  if (v.value_operator === 'BETWEEN') return `between ${v.value_constraint}${unit}`;
  return `${OPS[v.value_operator] || v.value_operator} ${v.value_constraint}${unit}`;
};
const lastPart = (key) => String(key || '').replace(/\\+$/, '').split('\\').pop();
const itemName = (it) => it.item_name || lastPart(it.item_key);
const dateText = (f, t) => (f && t ? `${f} to ${t}` : f ? `from ${f}` : t ? `until ${t}` : '');
function itemCons(it) {
  const out = [];
  if (it.constrain_by_value) out.push(valueText(it.constrain_by_value));
  const m = it.constrain_by_modifier;
  if (m) out.push((m.modifier_name || lastPart(m.modifier_key)) + (m.constrain_by_value ? ' ' + valueText(m.constrain_by_value) : ''));
  const d = it.constrain_by_date && dateText(it.constrain_by_date.date_from, it.constrain_by_date.date_to);
  if (d) out.push(d);
  return out;
}

/* ------------------------------------------------------------------ theme, header */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('cohort-theme', t); } catch (e) {}
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === t)));
}
document.querySelectorAll('[data-theme-set]').forEach((b) => (b.onclick = () => setTheme(b.dataset.themeSet)));
setTheme(document.documentElement.getAttribute('data-theme') || 'light');

function setMode(mode) {
  if (S.busy || mode === S.mode) return;
  S.mode = mode; S.chatId = null;
  document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  $('modeNote').textContent = mode === 'i2b2'
    ? 'i2b2 mode: every run is recorded with a QUERY_MASTER_ID; counts are obfuscated.'
    : 'DAX mode: free DAX on the Cohort Discovery model; counts only, obfuscated, nothing recorded.';
  $('input').placeholder = mode === 'i2b2'
    ? 'Ask a cohort question'
    : 'Ask a count question to answer with DAX';
  $('messages').innerHTML = ''; welcome(); renderSide();
}
document.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));

async function loadHeader() {
  try {
    S.info = await api('/api/info');
    $('account').textContent = S.info.account ? `GitHub: ${S.info.account.login}` : 'Not signed in to Copilot';
    const m = await api('/api/models');
    S.models = m.models;
    $('model').innerHTML = m.models.filter((x) => x.id !== 'auto').map((x) => `<option value="${esc(x.id)}">${esc(x.name || x.id)}</option>`).join('');
    $('model').value = localStorage.getItem('cohort-model') || m.default;
    if (!$('model').value) $('model').value = m.default;
    S.defaultEffort = m.default_effort;
    efforts();
  } catch (e) { $('account').textContent = e.message; }
}
function efforts() {
  const model = S.models.find((x) => x.id === $('model').value);
  const list = (model && model.efforts) || [];
  $('effort').hidden = !list.length;
  $('effort').innerHTML = list.map((e) => `<option value="${e}">${e === 'none' ? 'No thinking' : 'Thinking: ' + e}</option>`).join('');
  if (list.length) $('effort').value = list.includes(S.defaultEffort) ? S.defaultEffort : (model.default_effort || list[0]);
}
$('model').onchange = () => { localStorage.setItem('cohort-model', $('model').value); efforts(); S.chatId = null; };
$('effort').onchange = () => { S.chatId = null; };

/* ------------------------------------------------------------------ ontology browser */
const nodeHtml = (n) => {
  const folder = n.kind === 'folder' || n.kind === 'container';
  if (n.numeric_values) S.numeric[n.item_key] = true;
  return `<div class="node-wrap"><div class="node${folder ? ' folder' : ''}" data-key="${esc(n.item_key)}" data-name="${esc(n.name)}">
    <button class="node-toggle" aria-label="Open" ${folder ? '' : 'style="visibility:hidden"'}>▸</button>
    <span class="node-name" title="${esc(n.path || n.name)}">${esc(n.name)}</span>
    <span class="node-count">${esc(n.patients)}</span>
    <button class="node-add" title="Add to the selected panel" aria-label="Add ${esc(n.name)}">+</button></div></div>`;
};
async function openFolder(nodeEl) {
  const wrap = nodeEl.parentElement, toggle = nodeEl.querySelector('.node-toggle');
  const existing = wrap.querySelector(':scope > .children');
  if (existing) { existing.remove(); toggle.classList.remove('open'); return; }
  toggle.classList.add('open');
  const box = document.createElement('div');
  box.className = 'children enter'; box.innerHTML = '<div class="node-count" style="padding:4px 8px">Loading…</div>';
  wrap.appendChild(box);
  try { box.innerHTML = (await api('/api/ontology/browse?path=' + encodeURIComponent(nodeEl.dataset.key))).map(nodeHtml).join('') || '<div class="node-count" style="padding:4px 8px">Empty</div>'; }
  catch (e) { box.innerHTML = `<div class="alert">${esc(e.message)}</div>`; }
}
$('tree').onclick = (e) => {
  const node = e.target.closest('.node');
  if (!node) return;
  if (e.target.closest('.node-add')) return addItem({ item_key: node.dataset.key, item_name: node.dataset.name });
  if (node.classList.contains('folder')) openFolder(node);
};
async function loadRoots() {
  try { $('tree').innerHTML = (await api('/api/ontology/browse')).map(nodeHtml).join(''); }
  catch (e) { $('tree').innerHTML = `<p class="alert" style="margin:10px">${esc(e.message)}</p>`; }
}
let searchTimer;
$('search').oninput = () => {
  clearTimeout(searchTimer);
  const q = $('search').value.trim();
  if (!q) return loadRoots();
  searchTimer = setTimeout(async () => {
    try {
      const hits = await api('/api/ontology/search?q=' + encodeURIComponent(q));
      $('tree').innerHTML = hits.map((n) => nodeHtml(n).replace('</span>\n    <span class="node-count">', `<span class="hit-path">${esc(n.path)}</span></span>\n    <span class="node-count">`)).join('')
        || '<p class="muted" style="padding:8px 10px">No terms found.</p>';
    } catch (e) { $('tree').innerHTML = `<p class="alert" style="margin:10px">${esc(e.message)}</p>`; }
  }, 250);
};

/* ------------------------------------------------------------------ history */
async function loadHistory() {
  try {
    S.history = await api('/api/queries');
    $('railHistory').innerHTML = S.history.map((q) => `<button class="history-item${q.QUERY_MASTER_ID === S.currentQm ? ' current' : ''}" data-id="${q.QUERY_MASTER_ID}">
      <span class="hi-top"><span class="mono">${q.QUERY_MASTER_ID}</span><span>${esc(q.PATIENT_COUNT)}${q.REQUEST_STATUS ? ' · ' + esc(q.REQUEST_STATUS.toLowerCase()) : ''}</span></span>

function normalise(def) {

    total_item_occurrences: p.total_item_occurrences || 1, panel_date_from: p.panel_date_from || null, panel_date_to: p.panel_date_to || null,

}
function builderQuery() {
  const panels = S.builder.panels.filter((p) => p.items.length).map((p) => {
    const out = { items: p.items.map((it) => { const c = { item_key: it.item_key, item_name: it.item_name || '' };
      ['constrain_by_value', 'constrain_by_modifier', 'constrain_by_date'].forEach((k) => { if (it[k]) c[k] = it[k]; }); return c; }) };
    if (p.invert) out.invert = 1;
    if ((p.total_item_occurrences || 1) > 1) out.total_item_occurrences = Number(p.total_item_occurrences);
    if (p.panel_date_from) out.panel_date_from = p.panel_date_from;
    if (p.panel_date_to) out.panel_date_to = p.panel_date_to;
    if (S.builder.query_timing === 'SAMEVISIT' && p.panel_timing === 'SAMEVISIT') out.panel_timing = 'SAMEVISIT';
    return out;

}

/* ------------------------------------------------------------------ chat */
function md(text) {
  const blocks = [];
  let s = esc(text).replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, code) => { blocks.push(`<pre>${code}</pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = (t) => t.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  const out = []; let list = null, table = null;
  const flush = () => { if (list) { out.push(`<${list.t}>${list.items.map((i) => `<li>${inline(i)}</li>`).join('')}</${list.t}>`); list = null; }
    if (table) { const [h, ...rows] = table.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)); const cells = (r) => r.replace(/^\s*\||\|\s*$/g, '').split('|').map((c) => c.trim());
      out.push(`<table><thead><tr>${cells(h).map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`); table = null; } };
  for (const line of s.split('\n')) {
    let m;
    if (/^\s*\|.*\|\s*$/.test(line)) { if (list) flush(); (table = table || []).push(line); continue; }
    if (table) flush();
    if ((m = line.match(/^\s*[-*] (.*)/))) { if (list && list.t !== 'ul') flush(); (list = list || { t: 'ul', items: [] }).items.push(m[1]); continue; }
    if ((m = line.match(/^\s*\d+[.)] (.*)/))) { if (list && list.t !== 'ol') flush(); (list = list || { t: 'ol', items: [] }).items.push(m[1]); continue; }
    flush();
    if ((m = line.match(/^#{1,4} (.*)/))) out.push(`<h4>${inline(m[1])}</h4>`);
    else if (line.trim() === '') out.push('');
    else out.push(`<p>${inline(line)}</p>`);
  }
  flush();
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]).replace(/<p>(<pre>[\s\S]*?<\/pre>)<\/p>/g, '$1');
}

function setBusy(b) {

async function ask(text) {
  text = (text || $('input').value).trim();
  if (!text || S.busy) return;
  $('input').value = ''; autosize();
  addMsg('user', esc(text));
  const reply = addMsg('assistant', '');
  const body = reply.querySelector('.msg-body');
  const tools = document.createElement('div'); reply.insertBefore(tools, body);
  const status = document.createElement('div'); status.className = 'activity'; reply.appendChild(status);
  const started = Date.now(); let phase = 'Thinking', texts = {}, order = [];
  const tick = setInterval(() => { status.textContent = `${phase} · ${Math.round((Date.now() - started) / 1000)}s`; }, 500);
  setBusy(true);
  const render = () => { body.innerHTML = md(order.map((id) => texts[id]).join('\n\n')); };
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      message: text, mode: S.mode, chat_id: S.chatId, model: $('model').value, effort: $('effort').hidden ? null : $('effort').value,
      builder: S.mode === 'i2b2' ? builderQuery() : null, last_run: S.result && S.result.query_master_id }) });
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        switch (ev.type) {
          case 'chat': S.chatId = ev.chat_id; break;
          case 'thinking': phase = 'Thinking'; break;
          case 'delta': if (!texts[ev.id]) { texts[ev.id] = ''; order.push(ev.id); } texts[ev.id] += ev.text; phase = 'Writing'; render(); scrollDown(); break;
          case 'message': if (!texts[ev.id]) order.push(ev.id); texts[ev.id] = ev.text; render(); break;
          case 'tool': { if (order.length) { const n = document.createElement('div'); n.className = 'tool-note'; n.textContent = order.map((id) => texts[id]).join(' ').trim(); if (n.textContent) tools.appendChild(n); texts = {}; order = []; render(); }
            const t = document.createElement('div'); t.className = 'tool-line'; t.id = 't-' + ev.id; t.textContent = TOOL_WORDS[ev.name] || ev.name; tools.appendChild(t); phase = TOOL_WORDS[ev.name] || 'Working'; scrollDown(); break; }
          case 'tool_done': { const t = $('t-' + ev.id); if (t) t.classList.add(ev.ok ? 'done' : 'fail'); phase = 'Thinking'; break; }
          case 'query': S.builder = normalise(ev.definition); S.target = 0; if (ev.running) { S.result = null; S.request = null; } renderSide(); flash('#panels'); if (ev.running) { const rb = $('resultBox'); if (rb) rb.innerHTML = '<p class="activity">Running the query on the semantic model…</p>'; } break;
          case 'query_error': { const m = $('sideMsg'); if (m) m.innerHTML = `<span class="alert" style="display:block">${esc(ev.text)}</span>`; break; }
          case 'preview': S.builder = normalise(ev.result.query_definition); renderSide(); break;
          case 'result': S.result = { ...ev.result, question: text }; S.request = null; S.currentQm = ev.result.query_master_id; S.builderNote = text; renderSide(true); loadHistory(); break;
          case 'request': if (ev.request && ev.request.STATUS) { S.request = ev.request; renderSide(); loadHistory(); } break;
          case 'dax': S.daxRuns.unshift({ dax: ev.dax, purpose: ev.purpose }); renderSide(); break;
          case 'dax_result': { const d = S.daxRuns.find((x) => x.dax === ev.dax && !x.result && !x.error) || (S.daxRuns.unshift({ dax: ev.dax }), S.daxRuns[0]); d.purpose = d.purpose || ev.purpose; if (ev.error) d.error = ev.error; else d.result = ev.result; renderSide(); break; }
          case 'error': body.innerHTML += `<p class="alert">${esc(ev.text)}</p>`; break;
        }
      }
    }
  } catch (e) { body.innerHTML += `<p class="alert">${esc(e.message)}</p>`; }
  clearInterval(tick); status.remove(); setBusy(false);
  if (!body.textContent.trim() && !body.querySelector('.alert')) body.innerHTML = '<p class="muted">Stopped.</p>';
}
async function stop() { if (S.chatId) await api('/api/stop', { chat_id: S.chatId }).catch(() => {}); }
$('send').onclick = () => (S.busy ? stop() : ask());
const autosize = () => { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(180, t.scrollHeight) + 'px'; };
$('input').oninput = autosize;
$('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } };
$('newChat').onclick = () => { if (S.busy) return; S.chatId = null; S.daxRuns = []; $('messages').innerHTML = ''; welcome(); renderSide(); };

$('railToggle').onclick = () => { const open = document.body.classList.toggle('rail-open'); $('railToggle').setAttribute('aria-expanded', String(open)); };
document.addEventListener('click', (e) => {
  if (document.body.classList.contains('rail-open') && !e.target.closest('.rail, #railToggle')) { document.body.classList.remove('rail-open'); $('railToggle').setAttribute('aria-expanded', 'false'); }
});

function toast(text) { const m = $('sideMsg'); if (m) m.innerHTML = `<span class="alert" style="display:block">${esc(text)}</span>`; else alert(text); }

welcome(); renderSide(); loadHeader(); loadRoots();
</script>
